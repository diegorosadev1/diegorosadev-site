<!doctype html>
<html lang="pt-BR" class="dark scroll-smooth">
  <head>
    <!-- Básico -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      Diego Rosa | Criação de Sites Profissionais e Landing Pages
    </title>

    <meta
      name="description"
      content="Diego Rosa desenvolve sites profissionais, landing pages e experiências digitais para empresas que querem fortalecer sua marca, gerar confiança e transformar visitantes em oportunidades."
    />

    <meta name="author" content="Diego Rosa" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta name="googlebot" content="index, follow" />

    <meta name="theme-color" content="#07090e" />

    <meta name="color-scheme" content="dark" />

    <meta
      name="format-detection"
      content="telephone=no"
    />

    <!--
      IMPORTANTE:
      Substitua SEU-DOMINIO.com.br pelo domínio real do seu portfólio.
    -->
    <link
      rel="canonical"
      href="https://diegorosadev.com.br/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/logo.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/logo.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/logo.png"
    />

    <!-- Open Graph -->
    <meta property="og:locale" content="pt_BR" />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Diego Rosa"
    />

    <meta
      property="og:title"
      content="Diego Rosa | Criação de Sites Profissionais"
    />

    <meta
      property="og:description"
      content="Sites profissionais e landing pages pensados para fortalecer sua marca, gerar confiança e transformar visitantes em oportunidades."

    <meta
      property="og:url"
      content="https://diegorosadev.com.br/"
    />

    <meta
      property="og:image"
      content="https://diegorosadev.com.br/images/diego-rosa.jpg"
    />

    <meta
      property="og:image:alt"
      content="Diego Rosa | Engenheiro de Software"
    />

    <meta
      property="og:image:type"
      content="image/jpeg"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Diego Rosa | Criação de Sites Profissionais"
    />

    <meta
      name="twitter:description"
      content="Sites profissionais e landing pages para empresas que querem fortalecer sua presença online e gerar novas oportunidades."

    <meta
      name="twitter:image"
      content="https://diegorosadev.com.br/images/diego-rosa.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="Diego Rosa — Engenheiro de Software"
    />

    <!-- Performance: Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Dados estruturados:
      ajuda o Google a entender quem é o profissional
      por trás do site.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "@id": "https://diegorosadev.com.br/#diego-rosa",
        "name": "Diego Rosa",
        "url": "https://diegorosadev.com.br/",
        "image": "https://diegorosadev.com.br/images/diego-rosa.jpg",

        "description": "Engenheiro de Software especializado no desenvolvimento de sites profissionais, landing pages e soluções digitais.",

          "Desenvolvimento Web",
          "React",
          "TypeScript",
          "JavaScript",
          "Node.js",
          "Next.js",
          "SEO",
          "Performance Web",
          "Landing Pages",
          "Web Design"
        ]
      }
    </script>

    <!-- Identidade do site -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",

        "url": "https://diegorosadev.com.br/",
        "name": "Diego Rosa",
        "description": "Criação de sites profissionais e landing pages para empresas.",

          "@id": "https://diegorosadev.com.br/#diego-rosa"
        },
        "inLanguage": "pt-BR"

    </script>

        "url": "https://diegorosadev.com.br/",

        "description": "Desenvolvimento de sites profissionais, landing pages e experiências digitais para empresas.",
        "founder": {
          "@id": "https://diegorosadev.com.br/#diego-rosa"
        },
        "areaServed": {
          "@type": "Country",
          "name": "Brasil"
        },
        "serviceType": [
          "Criação de Sites",
          "Landing Pages",
          "Desenvolvimento Web",
          "SEO",
          "Manutenção de Sites"
        ]
      }

  <body

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
